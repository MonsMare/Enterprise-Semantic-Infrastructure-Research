[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-runtime-poc"
version = "0.1.0"
description = "Evidence-first, agentic Knowledge Runtime proof of concept"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "PyYAML>=6"]
pdf = ["pypdf>=5"]
runtime = ["psycopg[binary]>=3.2", "boto3>=1.35", "opensearch-py>=2.7"]
local-parser = ["docling>=2.0", "unstructured>=0.15"]
semantic = ["neo4j>=5.0"]

[tool.setuptools.packages.find]
include = ["knowledge_runtime*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
