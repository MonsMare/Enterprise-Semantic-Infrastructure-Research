[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-runtime-poc"
version = "0.1.0"
description = "Evidence-first, agentic Knowledge Runtime proof of concept"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
pdf = ["pypdf>=5"]

[tool.setuptools.packages.find]
include = ["knowledge_runtime*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
